[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vision-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-ollama",
    "pillow",
    "mss>=10.2,<11",
    "PySide6",
    "pyautogui>=0.9.54,<0.10",
]
[project.optional-dependencies]
dev = ["pytest"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[project.scripts]
vision-agent = "vision_agent.desktop:main"
